<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fullLogoTitle fullLogoDesc">
  <title id="fullLogoTitle">SAGROWINFOTECH full logo</title>
  <desc id="fullLogoDesc">SAGROWINFOTECH wordmark with abstract tech icon, blue-purple gradient, clean modern sans-serif.</desc>
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#2563EB" />
      <stop offset="1" stop-color="#7C3AED" />
    </linearGradient>
  </defs>
  <!-- icon on left -->
  <g transform="translate(18 18)">
