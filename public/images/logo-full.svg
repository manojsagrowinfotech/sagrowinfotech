    <g transform="translate(36 36)" fill="#fff">
      <path d="M4 92 C20 52, 68 36, 108 44 C148 52, 188 84, 196 116" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="4" cy="92" r="6" />
