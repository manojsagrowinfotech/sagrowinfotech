    <text x="0" y="0" fill="url(#g1)" font-family="Inter, Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="4">SAGROWINFOTECH</text>
